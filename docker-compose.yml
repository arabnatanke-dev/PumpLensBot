services:
  app:
    build: .
    restart: unless-stopped
    command: ["serve"]
    env_file:
      - path: .env
        required: false
    volumes:
      # Keep public thresholds editable without rebuilding the image.
      # Публичные пороги можно менять без пересборки образа.
      - ./settings.yaml:/app/settings.yaml:ro
      # Persistent normalized events for replay and outcome analysis.
      # Нормализованные события для replay и анализа результатов.
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: ["upgrade", "head"]
    entrypoint: ["alembic"]
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-bot.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pumplens
      POSTGRES_USER: pumplens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ "$$POSTGRES_PASSWORD" = "change_me" ] || [ "$$POSTGRES_PASSWORD" = "replace_with_a_long_random_password" ]; then
          echo "Refusing insecure POSTGRES_PASSWORD / Небезопасный POSTGRES_PASSWORD запрещён" >&2
          exit 1
        fi
        exec docker-entrypoint.sh postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pumplens -d pumplens"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
