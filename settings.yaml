# Public scanner settings; no API key is required.
# Настройки публичного сканера; API-ключ не требуется.
binance:
  rest_base_url: https://fapi.binance.com
  websocket_base_url: wss://fstream.binance.com
  request_timeout_seconds: 15.0
  warmup_concurrency: 8
  websocket_streams_per_connection: 180
  reconnect_max_seconds: 30.0
  planned_rotation_seconds: 85500
  stale_after_seconds: 12.0

scanner:
  profile: balanced
  min_quote_volume_24h: 2000000
  max_spread_pct: 0.35
  hard_reject_spread_pct: 0.70
  max_deep_candidates: 30
  candidate_score: 55
  watch_score: 70
  confirmed_score: 82
  cooldown_minutes: 20
  warmup_klines: 120
  scan_interval_seconds: 1.0
  top_limit: 10

# EARLY is a shadow radar until replay statistics justify user notifications.
# EARLY работает как теневой радар до проверки статистики на replay.
early:
  enabled: true
  shadow_mode: true
  min_score: 58
  max_score: 69.99
  min_volume_ratio: 5
  min_trade_rate_ratio: 5
  min_pressure: 0.72
  min_volume_z: 4
  min_return_1m_pct: 0.15
  max_return_1m_pct: 1.50
  max_return_5m_pct: 4
  max_spread_pct: 0.20
  min_quote_volume_1m: 5000
  min_trade_count_1m: 20
  debounce_hits: 2
  debounce_window_seconds: 3
  invalidate_after_seconds: 12
  pressure_reversal: 0.45
  against_move_pct: 0.25
  rearm_seconds: 60
  outcome_poll_seconds: 5
  liquidity_tiers:
    - name: thin
      min_quote_volume_24h: 2000000
      min_quote_volume_1m: 5000
      min_trade_count_1m: 20
    - name: mid
      min_quote_volume_24h: 25000000
      min_quote_volume_1m: 15000
      min_trade_count_1m: 40
    - name: liquid
      min_quote_volume_24h: 250000000
      min_quote_volume_1m: 50000
      min_trade_count_1m: 100

late:
  return_5m_pct: 8.0
  return_15m_pct: 15.0
  range_1m_pct: 6.0

# Deep entry validation runs only for the strongest Stage B candidates.
# Глубокая проверка входа запускается только для лучших кандидатов Stage B.
stage_c:
  enabled: true
  require_for_watch: true
  max_candidates: 8
  structure_lookback: 120
  pivot_window: 2
  level_lookback: 120
  level_cluster_tolerance_pct: 0.25
  level_min_touches: 1
  retest_tolerance_pct: 0.20
  atr_period: 14
  late_atr_multiplier: 3.0
  late_score_threshold: 70
  exhaustion_threshold: 70
  min_rr: 1.5
  min_entry_quality: 55
  max_distance_from_vwap_pct: 3.0
  min_room_pct: 0.50
  min_volume_confirmation: 2.5
  min_trade_confirmation: 2.0
  min_pressure_confirmation: 0.58
  healthy_spread_pct: 0.15
  min_depth_imbalance: 0.10
  min_oi_delta_pct: 0.05
  max_opposing_wick_ratio: 0.45
  volatility_buffer_atr: 0.20
  target_atr_multiplier: 2.0
  compression_ratio: 0.70
  expansion_ratio: 1.50
  weights:
    base_quality: 35
    structure_aligned: 12
    breakout_confirmed: 10
    retest_held: 14
    volume_confirmation: 6
    trades_confirmation: 5
    pressure_confirmation: 7
    oi_confirmation: 4
    spread_healthy: 4
    depth_supportive: 4
    room_available: 7
    rr_acceptable: 8
    late_penalty: 28
    exhaustion_penalty: 24
    failed_breakout_penalty: 30
    structure_conflict_penalty: 20
    vwap_distance_penalty: 10
    opposing_wick_penalty: 8

oi:
  poll_seconds: 30

onboarding:
  invite_only: true
  connect_session_ttl_seconds: 600
  privacy_version: "1.0"

portfolio:
  rest_reconcile_seconds: 300
  listen_key_keepalive_seconds: 2700
  max_private_accounts_per_instance: 50
  account_discovery_seconds: 5
  event_reconcile_debounce_seconds: 1
  stale_after_seconds: 600
  risk_scan_seconds: 5
  live_mark_stale_seconds: 5
  liquidation_warning_pct: 5
  pnl_milestones_pct: [5, 8, 10, 15, 20]

replay:
  enabled: true
  record_path: data/market.jsonl
  queue_size: 50000
  batch_size: 500
  flush_interval_seconds: 0.5
  max_file_size_mb: 200
  retention_days: 10
  gzip_rotated: true
  # bookTicker is intentionally omitted: replay uses ticker/trades/klines and the live scanner keeps it.
  # bookTicker намеренно не пишется: replay использует ticker/trades/klines, а live scanner его хранит.
  record_book_ticker: false

notifications:
  edit_debounce_seconds: 4
  min_score: 70
  directions: [LONG, SHORT]

telegram:
  # Telegram allows bots to delete messages for less than 48 hours.
  # Telegram разрешает удалять сообщения младше 48 часов.
  signal_ttl_hours: 47
  cleanup_scan_seconds: 60
